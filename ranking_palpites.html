<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa - Mural da Liga</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Suaviza a abertura do accordion */
        details > summary { list-style: none; }
        details::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    
    <nav class="bg-zinc-900 border-b border-zinc-800 h-16 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <span class="font-black tracking-wider text-amber-500 text-lg">BOLÃO DA COPA</span>
            <div class="flex gap-4 text-sm font-medium">
                <a href="dashboard.html" class="text-zinc-400 hover:text-white transition-colors">Dashboard</a>
                <a href="palpites.html" class="text-zinc-400 hover:text-white transition-colors">Meus Palpites</a>
                <a href="mural.html" class="text-white font-semibold border-b-2 border-amber-500 pb-5 mt-1">Mural da Liga</a>
                <a href="manual.html" class="text-zinc-400 hover:text-white transition-colors">Manual</a>
            </div>
        </div>
        <button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="text-xs text-red-400 hover:underline font-bold">Sair</button>
    </nav>

    <main class="flex-1 p-6 max-w-4xl w-full mx-auto space-y-6 pb-24">
        
        <div class="bg-zinc-900 p-4 rounded-2xl border border-zinc-800 flex items-center gap-3">
            <span class="text-xs font-bold text-zinc-500 uppercase tracking-wider">Liga:</span>
            <select id="seletor-liga-ativa" onchange="mudarLigaAtiva(this.value)" class="bg-zinc-950 border border-zinc-800 rounded-lg text-sm font-semibold h-10 px-3 text-amber-500 focus:outline-none focus:border-amber-500 cursor-pointer flex-1 md:max-w-xs appearance-none">
                <option value="">Carregando...</option>
            </select>
        </div>

        <div class="border-b border-zinc-800 pb-4">
            <h2 class="text-xl font-bold text-zinc-100">Palpites dos usuários</h2>
            <p class="text-xs text-zinc-400 mt-1">Veja as apostas dos seus adversários. Os palpites só são revelados quando o mercado do jogo fecha.</p>
        </div>

        <div class="overflow-x-auto pb-2 -mx-2 px-2 scrollbar-hide">
            <div id="abas-fases" class="flex gap-2 min-w-max"></div>
        </div>

        <div id="container-jogos-mural" class="flex flex-col gap-3">
            <p class="text-sm text-zinc-500 p-6 text-center">Carregando dados da liga...</p>
        </div>

    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/mural.js"></script>
</body>
</html>
