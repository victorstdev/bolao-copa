<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa - Meus Palpites</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    
    <nav class="bg-zinc-900 border-b border-zinc-800 h-16 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <span class="font-black tracking-wider text-amber-500 text-lg">BOLÃO DA COPA</span>
            <div class="flex gap-4 text-sm font-medium">
                <a href="dashboard.html" class="text-zinc-400 hover:text-white transition-colors">Dashboard</a>
                <a href="palpites.html" class="text-white font-semibold">Meus Palpites</a>
                <a href="ranking_palpites.html" class="text-zinc-400 hover:text-white transition-colors">Mural da Liga</a>
                <a href="manual.html" class="text-zinc-400 hover:text-white transition-colors">Manual</a>
            </div>
        </div>
        <button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="text-xs text-red-400 hover:underline font-bold">Sair</button>
    </nav>

    <main class="flex-1 p-6 max-w-4xl w-full mx-auto space-y-6 pb-24">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-800 pb-4">
            <div>
                <h2 class="text-xl font-bold text-zinc-100">Meus Palpites</h2>
                <p class="text-xs text-zinc-400 mt-1">O mercado fecha automaticamente 10 min antes do apito inicial.</p>
            </div>
        </div>

        <div class="overflow-x-auto pb-2 -mx-2 px-2 scrollbar-hide">
            <div id="abas-fases" class="flex gap-2 min-w-max">
                </div>
        </div>

        <div id="jogos-container" class="flex flex-col bg-zinc-900/30 rounded-xl border border-zinc-800 overflow-hidden shadow-xl">
            <p class="text-sm text-zinc-500 p-6 text-center">Carregando calendário de jogos...</p>
        </div>

    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/palpites.js"></script>
</body>
</html>
