<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa - Criar Conta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
    
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-md shadow-2xl relative">
        <a href="index.html" class="absolute top-6 left-6 text-zinc-500 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </a>

        <div class="text-center mb-8 mt-4">
            <h1 class="text-2xl font-black text-amber-500 tracking-wider">NOVO JOGADOR</h1>
            <p class="text-zinc-400 text-sm mt-2">Crie a sua conta e receba 3 Fichas de Ouro</p>
        </div>

        <form id="cadastro-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">Como quer ser chamado?</label>
                <input type="text" id="username" required placeholder="O seu nome ou apelido" class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500 placeholder:text-zinc-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com" class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500 placeholder:text-zinc-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">Senha</label>
                <input type="password" id="senha" required placeholder="Mínimo 6 caracteres" class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500 placeholder:text-zinc-700">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">Código de Convite</label>
                <input type="text" id="codigo-convite" required placeholder="Ex: FAMILIA" class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500 placeholder:text-zinc-700 uppercase">
            </div>
            
            <button type="submit" id="btn-cadastrar" class="w-full h-12 mt-6 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg transition-colors">
                Criar a Minha Conta
            </button>
        </form>
        
        <p id="cadastro-error" class="text-red-400 text-sm text-center mt-4 hidden"></p>
        <p id="cadastro-success" class="text-emerald-400 text-sm text-center mt-4 hidden"></p>

        <div class="mt-6 text-center border-t border-zinc-800/60 pt-6">
            <p class="text-zinc-400 text-xs">Já faz parte do bolão? <a href="index.html" class="text-amber-500 hover:underline font-bold">Inicie sessão aqui</a></p>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('cadastro-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('senha').value;
            const codigoConvite = document.getElementById('codigo-convite').value.toUpperCase().trim(); // <-- Puxa o código de convite e formata para maiúsculas
            
            const errorMsg = document.getElementById('cadastro-error');
            const successMsg = document.getElementById('cadastro-success');
            const btn = document.getElementById('btn-cadastrar');
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            
            if (password.length < 6) {
                errorMsg.textContent = "A palavra-passe deve ter pelo menos 6 caracteres.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'A preparar a sua entrada...';
            
            // O signUp envia os dados base + o metadata (nome) que o Trigger SQL vai apanhar
            const { data, error } = await window.supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        username: username,
                        codigo_convite: codigoConvite
                    }
                }
            });
            
            if (error) {
                errorMsg.textContent = "Erro no registo: " + error.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Criar a Minha Conta';
            } else {
                successMsg.textContent = "Conta criada com sucesso! A entrar na arena...";
                successMsg.classList.remove('hidden');
                
                // Redireciona automaticamente para o painel principal
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            }
        });
    </script>
</body>
</html>
