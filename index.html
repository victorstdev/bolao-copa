<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão da Copa - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-6">
    
    <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-amber-500 tracking-wider">BOLÃO DA COPA</h1>
            <p class="text-zinc-400 text-sm mt-2">Inicie sessão para gerir os seus palpites</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-zinc-500 uppercase tracking-wide mb-1">Palavra-passe</label>
                <input type="password" id="senha" required class="w-full h-12 bg-zinc-950 border border-zinc-800 rounded-lg px-4 text-white focus:outline-none focus:border-amber-500">
            </div>
            <button type="submit" id="btn-login" class="w-full h-12 mt-4 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg transition-colors">
                Entrar na Arena
            </button>
        </form>
        
        <p id="login-error" class="text-red-400 text-sm text-center mt-4 hidden"></p>

        <div class="mt-6 text-center border-t border-zinc-800/60 pt-6">
            <p class="text-zinc-400 text-xs">Ainda não tem uma conta? <br>
                <a href="cadastro.html" class="text-amber-500 hover:underline font-bold text-sm inline-block mt-1">Registe-se aqui</a>
            </p>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('senha').value;
            const errorMsg = document.getElementById('login-error');
            const btn = document.getElementById('btn-login');
            
            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'A validar acesso...';
            
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.textContent = "Credenciais inválidas. Tente novamente.";
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Entrar na Arena';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
