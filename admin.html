<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa - ADMIN</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    
    <nav class="bg-zinc-900 border-b border-zinc-800 h-16 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <span class="font-black tracking-wider text-red-500 text-lg">ÁREA ADMIN</span>
        </div>
        <button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="text-xs text-zinc-400 hover:text-white">Voltar ao Login</button>
    </nav>

    <main class="flex-1 p-6 max-w-5xl w-full mx-auto space-y-8 pb-24">
        
        <!-- Formulário de Cadastro de Novo Jogo -->
        <div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800">
            <h3 class="text-lg font-bold text-zinc-100 mb-4">Cadastrar Nova Partida</h3>
            <form id="form-cadastro-partida" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                <div class="col-span-1 md:col-span-2 flex gap-2">
                    <div class="flex-1">
                        <label class="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Time Casa</label>
                        <input type="text" id="new-casa" required class="w-full h-10 bg-zinc-950 border border-zinc-800 rounded px-3 text-sm text-white">
                    </div>
                    <div class="flex-1">
                        <label class="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Time Fora</label>
                        <input type="text" id="new-fora" required class="w-full h-10 bg-zinc-950 border border-zinc-800 rounded px-3 text-sm text-white">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Fase do Torneio</label>
                    <input type="text" id="new-fase" placeholder="Ex: Grupo A, Oitavas" required class="w-full h-10 bg-zinc-950 border border-zinc-800 rounded px-3 text-sm text-white">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 font-bold uppercase mb-1 block">Data e Hora</label>
                    <input type="datetime-local" id="new-data" required class="w-full h-10 bg-zinc-950 border border-zinc-800 rounded px-3 text-sm text-white [color-scheme:dark]">
                </div>
                <div class="flex items-center justify-between gap-4">
                    <label class="flex items-center gap-2 text-xs text-yellow-500 font-bold cursor-pointer">
                        <input type="checkbox" id="new-is-brasil" class="rounded bg-zinc-950 border-zinc-800 text-yellow-500 focus:ring-0">
                        É do Brasil?
                    </label>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold h-10 px-4 rounded text-sm transition-colors">Cadastrar</button>
                </div>
            </form>
        </div>

        <!-- Gestão de Jogos e Placares Reais -->
        <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <h2 class="text-xl font-bold text-zinc-100">Gestão de Placares e Status</h2>
                <button onclick="salvarTodasAsPartidas()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-6 py-2 rounded-lg transition-colors">
                    Salvar TUDO e Rodar Cálculos
                </button>
            </div>
            
            <div id="admin-jogos-container" class="space-y-3">
                <!-- Preenchido pelo admin.js -->
            </div>
        </div>

    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
