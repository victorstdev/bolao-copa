<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-zinc-900 border-b border-zinc-800 h-16 px-6 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <span class="font-black tracking-wider text-amber-500 text-lg">BOLÃO COPA</span>
            <div class="flex gap-4 text-sm font-medium">
                <a href="dashboard.html" class="text-white font-semibold">Dashboard</a>
                <a href="palpites.html" class="text-zinc-400 hover:text-white transition-colors">Meus Palpites</a>
            </div>
        </div>
        <button onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='index.html')" class="text-xs text-red-400 hover:underline font-bold">Sair</button>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-5xl w-full mx-auto space-y-8 pb-24">
        
        <!-- Cabeçalho e Resumo do Usuário -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 col-span-1 md:col-span-2 flex flex-col justify-center">
                <h2 class="text-2xl font-bold text-zinc-100">E aí, <span id="user-welcome-name" class="text-amber-500">...</span>!</h2>
                <p class="text-sm text-zinc-400 mt-1">Acompanhe seu desempenho e as conquistas desbloqueadas.</p>
            </div>
            <div class="grid grid-cols-2 gap-4 col-span-1">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex flex-col justify-center items-center text-center">
                    <span class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider">Pontuação Geral</span>
                    <span id="user-total-pontos" class="text-2xl font-black text-white mt-1">0 pts</span>
                </div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 flex flex-col justify-center items-center text-center relative overflow-hidden">
                    <span class="text-[10px] uppercase font-bold text-amber-500/80 tracking-wider">Fichas de Ouro</span>
                    <span id="user-total-fichas" class="text-2xl font-black text-amber-400 mt-1 relative z-10">0</span>
                    <div class="absolute inset-0 bg-amber-500/5 z-0"></div>
                </div>
            </div>
        </div>

        <!-- NOVO: Coleção de Medalhas da Arena -->
        <div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800 space-y-4">
            <div>
                <h3 class="text-lg font-bold text-zinc-100 flex items-center gap-2">🏅 Coleção de Medalhas</h3>
                <p class="text-xs text-zinc-400 mt-0.5">Crave palpites difíceis e junte conquistas ao longo do torneio.</p>
            </div>
            <div id="medalhas-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 pt-2">
                <!-- Preenchido pelo dashboard.js -->
            </div>
        </div>

        <!-- Ranking Geral -->
        <div class="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden">
            <div class="p-6 border-b border-zinc-800">
                <h3 class="text-lg font-bold text-zinc-100">🏆 Classificação Geral</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-zinc-950/50 text-xs uppercase tracking-wider text-zinc-500">
                            <th class="p-4 w-12 text-center font-bold">Pos</th>
                            <th class="p-4 font-bold">Participante</th>
                            <th class="p-4 text-right font-bold">Pontos</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-table-body">
                        <!-- Preenchido pelo dashboard.js -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
